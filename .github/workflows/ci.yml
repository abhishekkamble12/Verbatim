name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    # Real Postgres with pgvector: the migration, HNSW/GIN indexes and tenant isolation are tested here.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: citeguard
          POSTGRES_PASSWORD: citeguard_dev_password
          POSTGRES_DB: citeguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U citeguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AUTH_MODE: local

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linter
        run: ruff check .

      - name: Run tests
        run: pytest -q

      - name: Run evaluation harness (verifier)
        run: python -m packages.evaluation.runner

      - name: Check evaluation quality release gate
        run: python scripts/check_ci_gate.py

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check
      # No AWS credentials here: this checks the configuration, it does not plan or create anything.
      - run: terraform init -backend=false -input=false
      - run: terraform validate
