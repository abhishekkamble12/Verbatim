name: Deploy

# Manual only: run it from the Actions tab once `terraform apply` has created the AWS resources.
on:
  workflow_dispatch:

permissions:
  id-token: write # GitHub OIDC -> short-lived AWS credentials, no stored keys
  contents: read

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # ECR_REPO, FRONTEND_BUCKET, CF_DISTRIBUTION_ID, INSTANCE_ID, VITE_COGNITO_* (written by Terraform).
      - name: Load deploy settings from SSM
        run: |
          aws ssm get-parameters-by-path --path /citeguard/deploy \
            --query 'Parameters[*].[Name,Value]' --output text \
            | sed 's|^/citeguard/deploy/||; s|\t|=|' >> "$GITHUB_ENV"

      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-qemu-action@v3 # the instance is arm64 (t4g)
      - uses: docker/setup-buildx-action@v3

      - name: Build and push the image
        run: docker buildx build --platform linux/arm64 -t "$ECR_REPO:latest" -t "$ECR_REPO:$GITHUB_SHA" --push .

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build and publish the web app
        run: |
          cd apps/web
          npm ci
          npm run build
          aws s3 sync dist "s3://$FRONTEND_BUCKET" --delete
          aws cloudfront create-invalidation --distribution-id "$CF_DISTRIBUTION_ID" --paths '/*'

      - name: Restart the containers on the instance
        run: |
          id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --parameters 'commands=["/opt/citeguard/deploy.sh"]' --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$id" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" --query Status --output text)
          test "$status" = Success
