[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "citeguard"
version = "0.1.0"
description = "A Verified-Citation Research Workspace with a Bounded Research Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.28",
    "psycopg[binary]>=3.1.18",
    "pgvector>=0.2.5",
    "alembic>=1.13.1",
    "boto3>=1.34.0",
    "pymupdf>=1.23.26",
    "trafilatura>=1.8.0",
    "httpx>=0.27.0",
    "lxml_html_clean>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]

# Flat layout with data/infra dirs at the root: list the code explicitly or setuptools refuses to build.
[tool.setuptools.packages.find]
include = ["packages*", "services*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["real_gateway: run against the real gateway functions (no fake LLM)"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

