# Production stack on the EC2 host. Started by /opt/citeguard/deploy.sh (infra/terraform/user_data.sh.tftpl),
# which writes .env from SSM and exports IMAGE. S3, SQS and Cognito are the real AWS services.
x-app: &app
  image: ${IMAGE}
  restart: always
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://citeguard:${POSTGRES_PASSWORD}@postgres:5432/citeguard

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: citeguard-postgres
    restart: always
    environment:
      POSTGRES_USER: citeguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: citeguard
    # No published port: only the api and worker containers can reach the database.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citeguard -d citeguard"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: &logging
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: /citeguard/app
        awslogs-stream: postgres

  api:
    <<: *app
    command: sh -c "alembic upgrade head && uvicorn services.api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "80:8000"
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      <<: *logging
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: /citeguard/app
        awslogs-stream: api

  worker:
    <<: *app
    command: python -m services.worker.main
    depends_on:
      - api # the api container runs the migrations
    logging:
      <<: *logging
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: /citeguard/app
        awslogs-stream: worker

volumes:
  pgdata:
